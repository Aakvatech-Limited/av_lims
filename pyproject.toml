[project]
name = "av_lims"
authors = [{name = "Aakvatech Limited", email = "info@aakvatech.com"}]
description = "Laboratory and construction materials testing management for ERPNext"
requires-python = ">=3.14,<3.15"
readme = "README.md"
license = "MIT"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core>=3.12,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.55.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
